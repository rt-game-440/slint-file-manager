# Issue #3 兼容原型：原生右键菜单 / NanaZip 承载、云占位文件与缩略图边界。
# 独立 crate，不属于主程序；windows 版本与主工程 Cargo.lock 中已有的 0.62.2 对齐，便于 #9 / #14 复用。
[package]
name = "shell-cloud-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_CloudFilters",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_CorrelationVector",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]
