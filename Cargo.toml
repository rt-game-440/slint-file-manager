[package]
name = "slint-file-manager"
version = "0.1.0"
edition = "2024"

[features]
# 调试观测框架（无头驱动、截图、逐帧采集）。默认关闭，不进入发布产物。
harness = [
    "dep:i-slint-backend-testing",
    "dep:png",
    "dep:gif",
]

[dependencies]
slint = { version = "1.18.1", features = ["raw-window-handle-06", "unstable-winit-030"] }
# 取得主窗口 HWND（接管外部拖放目标）
raw-window-handle = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 会话文件（%LOCALAPPDATA%\slint-file-manager\session.json）的读写
serde_json = "1"
# 缩略图（Issue #10，路线见 docs/research/0005-thumbnail-route.md）：WebP 用 libwebp 解码时缩放；
# JPEG／PNG／GIF／BMP 用 image 解码、fast_image_resize 缩放；磁盘缓存载荷为有损 WebP
libwebp-sys = "0.14"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp"] }
fast_image_resize = "6"
# Windows API：默认应用打开（ShellExecuteExW）、资源管理器同款名称排序（StrCmpLogicalW）、读取系统文字缩放
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# 回收站（IShellFolder 外壳命名空间枚举、undelete 还原）与 SHFileOperationW 回收删除（src/recycle.rs）、
# 云文件 API（Win32_Storage_CloudFilters，src/cloud：同步根与占位信息只读查询，Issue #14）、
# 原生右键菜单（IContextMenu 系列接口，src/shell_menu；GDI／HiDpi／线程／键盘特性用于菜单锚点与资源观测）：COM 接口封装
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_CloudFilters",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_CorrelationVector",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
# windows 的 #[implement] 宏展开需要直接依赖 windows-core（实现 IDropTarget）
windows-core = "0.62"
# 内部测试后端，必须与 slint 同版本（见 docs/debug-harness.md）
i-slint-backend-testing = { version = "=1.18.1", optional = true, features = ["renderer-software"] }
png = { version = "0.18", optional = true }
gif = { version = "0.14", optional = true }

[build-dependencies]
slint-build = "1.18.1"

[[bin]]
name = "slint-file-manager"
path = "src/main.rs"

[[bin]]
name = "harness"
path = "src/bin/harness/main.rs"
required-features = ["harness"]

# 真实窗口里的原生右键菜单自测（Issue #9）：真实事件循环、真实外壳、受控夹具；发布产物不含
[[bin]]
name = "menu-selftest"
path = "src/bin/menu-selftest/main.rs"
required-features = ["harness"]
