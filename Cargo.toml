[package]
name = "slint-file-manager"
version = "0.1.0"
edition = "2024"

[features]
# 调试观测框架（无头驱动、截图、逐帧采集）。默认关闭，不进入发布产物。
harness = [
    "dep:i-slint-backend-testing",
    "dep:png",
    "dep:gif",
]

[dependencies]
slint = "1.18.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 会话文件（%LOCALAPPDATA%\slint-file-manager\session.json）的读写
serde_json = "1"
# Windows API：默认应用打开（ShellExecuteExW）、资源管理器同款名称排序（StrCmpLogicalW）、读取系统文字缩放
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# 回收站（IShellFolder 外壳命名空间枚举、undelete 还原）与 SHFileOperationW 回收删除（src/recycle.rs）、
# 原生右键菜单（IContextMenu 系列接口，src/shell_menu；GDI／HiDpi／线程／键盘特性用于菜单锚点与资源观测）：COM 接口封装
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
# 内部测试后端，必须与 slint 同版本（见 docs/debug-harness.md）
i-slint-backend-testing = { version = "=1.18.1", optional = true, features = ["renderer-software"] }
png = { version = "0.18", optional = true }
gif = { version = "0.14", optional = true }

[build-dependencies]
slint-build = "1.18.1"

[[bin]]
name = "slint-file-manager"
path = "src/main.rs"

[[bin]]
name = "harness"
path = "src/bin/harness/main.rs"
required-features = ["harness"]

# 真实窗口里的原生右键菜单自测（Issue #9）：真实事件循环、真实外壳、受控夹具；发布产物不含
[[bin]]
name = "menu-selftest"
path = "src/bin/menu-selftest/main.rs"
required-features = ["harness"]
