# Issue #23 文件选择对话框测试宿主：用 Windows 常见的几种方式弹出文件选择对话框，并把返回结果完整记录下来。
# 独立 crate，不属于主程序，不进入发布包；依赖保持最小（windows 绑定 + serde_json，版本与主程序一致，复用全局缓存）。
[package]
name = "dialog-host"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
serde_json = "1"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]
